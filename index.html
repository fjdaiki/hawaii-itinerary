<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハワイ旅程 2026</title>
<meta name="theme-color" content="#0e9aa7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ハワイ旅程">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">ハワイ旅程 2026</div>
    <div class="top-sub" id="top-sub"></div>
  </div>
</header>

<main id="main">
  <div id="load-error" class="alert danger" hidden></div>

  <section id="view-today" class="view" data-view="today"></section>

  <section id="view-days" class="view" data-view="days" hidden>
    <nav class="datebar" id="datebar" aria-label="日付"></nav>
    <div id="day-pane" class="day-pane"></div>
    <p class="swipe-hint">左右にスワイプで前後の日へ</p>
  </section>

  <section id="view-hotels" class="view" data-view="hotels" hidden></section>

  <section id="view-budget" class="view" data-view="budget" hidden></section>

  <section id="view-check" class="view" data-view="check" hidden></section>
</main>

<nav class="tabbar" aria-label="画面切り替え">
  <button data-go="today" aria-current="page">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今日</button>
  <button data-go="days">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>日程</button>
  <button data-go="hotels">
    <svg viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg>ホテル</button>
  <button data-go="budget">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 6V4h12v2"/></svg>予算</button>
  <button data-go="check">
    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l2 2 4-4M8 16h8"/></svg>準備</button>
</nav>

<dialog id="editor" class="sheet">
  <form id="editor-form" method="dialog">
    <div class="sheet-head">
      <h2 id="editor-title">予定を編集</h2>
      <button type="button" class="link" id="editor-cancel">閉じる</button>
    </div>
    <fieldset class="slots">
      <legend>時間帯</legend>
      <label><input type="radio" name="slot" value="morning" checked><span>朝</span></label>
      <label><input type="radio" name="slot" value="noon"><span>昼</span></label>
      <label><input type="radio" name="slot" value="evening"><span>夕</span></label>
      <label><input type="radio" name="slot" value="night"><span>夜</span></label>
    </fieldset>
    <label class="field">予定<input id="ed-title" name="title" required autocomplete="off"></label>
    <label class="field">場所<input id="ed-place" name="place" autocomplete="off"></label>
    <label class="field">メモ<textarea id="ed-memo" name="memo" rows="3"></textarea></label>
    <label class="field">Googleマップのリンク（空なら場所名で検索）<input id="ed-map" name="map" type="url" inputmode="url" autocomplete="off" placeholder="https://maps.app.goo.gl/..."></label>
    <label class="check-inline"><input type="checkbox" id="ed-rest" name="rest"> 休憩の時間（昼寝・プール）</label>
    <div class="sheet-actions">
      <button type="button" class="btn danger-outline" id="editor-delete">削除</button>
      <button type="submit" class="btn primary" id="editor-save">保存</button>
    </div>
    <div class="confirm" id="delete-confirm" hidden>
      <span>この予定を削除しますか？</span>
      <button type="button" class="btn" id="delete-no">やめる</button>
      <button type="button" class="btn danger" id="delete-yes">削除する</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
